stages:
  download_conventional_mastr:
    cmd: uv run python pipeline/12_download_conventional_mastr.py
    deps:
      - pipeline/12_download_conventional_mastr.py
    outs:
      - data/downloads/mastr_conventional_units.parquet:
          persist: true

  merit_order_replication:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/13_merit_order_replication.ipynb
      pipeline/13_merit_order_replication.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/13_merit_order_replication.ipynb
    deps:
      - pipeline/13_merit_order_replication.py
      - data/downloads/mastr_conventional_units.parquet
    outs:
      - book/notebooks/13_merit_order_replication.ipynb:
          cache: false
      - output/images/13_merit_order_curve.png:
          cache: false
      - output/images/13_marginal_cost_boxplot.png:
          cache: false

  pecd_de_capacity_factors_vs_constant_demand:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/05_pecd_de_capacity_factors_vs_constant_demand.ipynb
      pipeline/05_pecd_de_capacity_factors_vs_constant_demand.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/05_pecd_de_capacity_factors_vs_constant_demand.ipynb
    deps:
      - pipeline/05_pecd_de_capacity_factors_vs_constant_demand.py
      - ../energy-data-hub/data/pecd/pecd_country_capacity_factors_simple_de.parquet
      - ../energy-data-hub/data/smard/load.parquet
      - ../energy-data-hub/data/capacity/capacity_by_region_year.parquet
    outs:
      - book/notebooks/05_pecd_de_capacity_factors_vs_constant_demand.ipynb:
          cache: false
      - output/images/05_demand_2025_vs_constant_peak.png:
          cache: false
      - output/images/05_pecd_de_capacity_factors_bar.png:
          cache: false
      - output/images/05_buildout_no_battery_bars.png:
          cache: false
      - output/images/05_scale_check_bars.png:
          cache: false
      - output/images/05_battery_decomposition_2x.png:
          cache: false
      - output/images/05_battery_delivered_vs_multiplier.png:
          cache: false
      - output/images/05_re_share_and_curtailment.png:
          cache: false
      - output/images/05_residual_load_heatmap.png:
          cache: false

  pecd_country_and_regional_capacity_factors:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/06_pecd_country_and_regional_capacity_factors.ipynb
      pipeline/06_pecd_country_and_regional_capacity_factors.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/06_pecd_country_and_regional_capacity_factors.ipynb
    deps:
      - pipeline/06_pecd_country_and_regional_capacity_factors.py
      - ../energy-data-hub/data/pecd/pecd_country_capacity_factors_simple.parquet
      - ../energy-data-hub/data/pecd/pecd_solar_capacity_factors.parquet
      - ../energy-data-hub/data/pecd/capacity_factors_europe/pecd_wind_onshore_tech30_1980-1989.parquet
      - ../energy-data-hub/data/pecd/capacity_factors_europe/pecd_wind_onshore_tech30_1990-1999.parquet
      - ../energy-data-hub/data/pecd/capacity_factors_europe/pecd_wind_onshore_tech30_2000-2009.parquet
      - ../energy-data-hub/data/pecd/capacity_factors_europe/pecd_wind_onshore_tech30_2010-2019.parquet
      - ../energy-data-hub/data/pecd/capacity_factors_europe/pecd_wind_onshore_tech30_2020-2025.parquet
    outs:
      - book/notebooks/06_pecd_country_and_regional_capacity_factors.ipynb:
          cache: false
      - output/images/06_country_mean_cf_bars.png:
          cache: false
      - output/images/06_country_mean_cf_map.png:
          cache: false
      - output/images/06_wind_onshore_zone_spread.png:
          cache: false
      - output/images/06_de_solar_nuts2_bar.png:
          cache: false

  merit_order_steepness_vs_intraday_volatility:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/18_merit_order_steepness_vs_intraday_volatility.ipynb
      pipeline/18_merit_order_steepness_vs_intraday_volatility.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/18_merit_order_steepness_vs_intraday_volatility.ipynb
    deps:
      - pipeline/18_merit_order_steepness_vs_intraday_volatility.py
      - ../energy-data-hub/data/balancing_market/id_aep.parquet
      - ../energy-data-hub/data/smard/load.parquet
      - ../energy-data-hub/data/smard/generation_wind_onshore.parquet
      - ../energy-data-hub/data/smard/generation_wind_offshore.parquet
      - ../energy-data-hub/data/smard/generation_solar.parquet
      - ../energy-data-hub/data/smard/forecast_onshore.parquet
      - ../energy-data-hub/data/smard/forecast_offshore.parquet
      - ../energy-data-hub/data/smard/forecast_solar.parquet
      - ../energy-data-hub/data/smard/price_de_lu.parquet
    outs:
      - book/notebooks/18_merit_order_steepness_vs_intraday_volatility.ipynb:
          cache: false
      - output/images/18_revealed_merit_order.png:
          cache: false
      - output/images/18_merit_order_slope.png:
          cache: false
      - output/images/18_correction_vs_forecast_error_by_slope.png:
          cache: false

  balancing_timeline:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/10_balancing_timeline.ipynb
      pipeline/10_balancing_timeline.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/10_balancing_timeline.ipynb
    deps:
      - pipeline/10_balancing_timeline.py
    outs:
      - book/notebooks/10_balancing_timeline.ipynb:
          cache: false
      - output/images/10_balancing_timeline.png:
          cache: false

  download_example:
    cmd: uv run python pipeline/01_download_example.py
    deps:
      - pipeline/01_download_example.py
    outs:
      - data/downloads/example_data.parquet:
          persist: true

  process_example:
    cmd: >-
      MPLBACKEND=Agg uv run jupytext --to notebook --execute
      --set-kernel python3
      --output book/notebooks/02_analyse_example.ipynb
      pipeline/02_analyse_example.py &&
      uv run python pipeline/_strip_jupytext_metadata.py
      book/notebooks/02_analyse_example.ipynb
    deps:
      - pipeline/02_analyse_example.py
      - data/downloads/example_data.parquet
    outs:
      - book/notebooks/02_analyse_example.ipynb:
          cache: false
      - output/images/02_daily_average.png:
          cache: false
      - output/images/02_category_dist.png:
          cache: false
