[project]
name = "energy-research"
version = "0.1.0"
description = "Exploratory research playground for the energy-platform stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline infrastructure — required by the template itself
    "dvc>=3.55.0",
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "mystmd>=1.8.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.0",
    # add your project-specific analysis packages below, e.g.:
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "windpowerlib>=0.2.2",
    "astral>=3.2",
    "cartopy>=0.26.0",
    "shapely>=2.0.0",
    "open-mastr==0.17.4",  # pinned to match energy-data-hub's version -- open-mastr 1.0.0 fails to parse EinheitenVerbrennung.xml (int64 cast error on a list-valued column)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erx"]
